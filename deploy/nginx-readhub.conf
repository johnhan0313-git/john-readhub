# news.cool-app.me — ReadHub
#
# 已合并到 john-server ~/mydocker/mntdata/nginx/nginx.conf
# compose 已将 backend/frontend 加入 john-nginx_default，Deploy 即可

    server {
        listen 80;
        server_name news.cool-app.me;

        client_max_body_size 20m;

        location /api/ {
            set $readhub_backend http://john-readhub-backend-1:8001;
            proxy_pass $readhub_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        location / {
            set $readhub_frontend http://john-readhub-frontend-1:3001;
            proxy_pass $readhub_frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
    }
