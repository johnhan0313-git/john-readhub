services:
  backend:
    build: ./backend
    ports:
      - "8001:8001"
    env_file:
      - ./backend/.env
    environment:
      USE_MIGRATIONS: "true"
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "3001:3001"
    env_file:
      - ./frontend/.env
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8001/api
      PORT: "3001"
    depends_on:
      - backend
    restart: unless-stopped
